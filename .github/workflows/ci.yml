name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      # Let every platform report; a red leg should not hide the others.
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # gpui's system dependencies on Linux.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libxcb1-dev libx11-xcb-dev libfontconfig1-dev libfreetype-dev \
            libasound2-dev libvulkan-dev pkg-config cmake nasm

      # rav1e (AVIF encoding) assembles with nasm on x86_64.
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Lints once, on macOS — the findings are identical per platform.
      - name: fmt
        if: matrix.os == 'macos-14'
        run: cargo fmt --all -- --check

      - name: test
        run: cargo test --workspace

      - name: clippy
        if: matrix.os == 'macos-14'
        run: cargo clippy --workspace -- -D warnings
